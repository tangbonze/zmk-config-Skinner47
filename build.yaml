include:
  # Central (left) half: talks to the host, runs the ZMK Studio / DYA Studio RPC.
  - artifact: skinner47_left
    board: skinner47_left
    shield: nice_view
    snippets:
      - studio-rpc-usb-uart

  # Peripheral (right) half: carries the PMW3610 trackball.
  - artifact: skinner47_right
    board: skinner47_right
    shield: nice_view

  # Flash these to wipe stored settings (keymap edits, custom settings,
  # battery history, BLE profiles) and start over from firmware defaults.
  - artifact: skinner47_left_reset
    board: skinner47_left
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y

  - artifact: skinner47_right_reset
    board: skinner47_right
    shield: nice_view
    cmake-args: -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y
